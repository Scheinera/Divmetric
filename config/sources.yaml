  sister: Velumetric
  site_base: https://divmetric.pages.dev  # placeholder até o primeiro deploy

sources:
  official:
    - id: bcb_sgs
      name: Banco Central do Brasil (SGS)
      role: selic_ipca_macro
      trust: canonical
  market:
