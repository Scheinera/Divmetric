name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wrangler.toml"
      - "config/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-cloudflare-pages]

concurrency:
  group: cloudflare-pages-divmetric
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE secrets on Scheinera/Divmetric."
            echo "Trigger Velumetric workflow deploy-divmetric-pages.yml to bootstrap, or run:"
            echo "  .\\scripts\\setup-cloudflare-secrets.ps1 -Repos Divmetric"
            # Fallback: ask Velumetric hub to deploy this revision
            if command -v gh >/dev/null 2>&1; then
              gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                /repos/Scheinera/Velumetric/dispatches \
                -f event_type='deploy-divmetric-pages' || true
            fi
            exit 1
          fi

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create divmetric --production-branch=main
        continue-on-error: true

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=divmetric --branch=main --commit-dirty=true
