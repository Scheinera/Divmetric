name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wrangler.toml"
      - "config/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-cloudflare-pages]

concurrency:
  group: cloudflare-pages-divmetric-request
  cancel-in-progress: true

jobs:
  deploy-via-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Velumetric hub to publish Divmetric
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set CROSS_REPO_TOKEN on Scheinera/Divmetric."
            exit 1
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/Scheinera/Velumetric/dispatches \
            -f event_type='deploy-divmetric-pages'
          echo "Dispatched deploy-divmetric-pages on Scheinera/Velumetric"
