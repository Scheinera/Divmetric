<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de dividendos — Divmetric</title>
  <meta name="description" content="Radar de DY e total return — ações e FIIs líquidos B3.">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <div id="site-nav" class="site-nav"></div>
  <header class="page-header">
    <p class="section-kicker">Dividendos · total return · FIIs</p>
    <h1>Radar de <span>dividendos</span></h1>
    <p class="tagline">Ações e fundos imobiliários: DY e total return ~12m (preço/cota + proventos). Ordenado por TSR.</p>
  </header>

  <main class="wrap">
    <section class="card" id="panel">
      <p class="muted">Carregando…</p>
    </section>
  </main>

  <footer class="site-footer">
    · <a href="/">Início</a> · <a href="/calculadora/">Calculadora</a> · <a href="/mundo/">Economias</a> · <a href="https://velumetric.pages.dev/">Velumetric</a>
  </footer>
  <script src="/assets/site.js"></script>
  <script>
    const { loadJSON } = window.DivmetricSite;

    function fmt(v, digits = 2) {
      if (v == null || Number.isNaN(Number(v))) return "—";
      return Number(v).toFixed(digits);
    }

    function fmtVol(v) {
      if (v == null) return "—";
      return Number(v).toLocaleString("pt-BR");
    }

    function tableFor(rows, title) {
      if (!rows.length) return `<h2>${title}</h2><p class="muted">Sem dados nesta coleta.</p>`;
      return `
        <h2>${title}</h2>
        <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Ticker</th>
              <th>DY %</th>
              <th title="(final − inicial + proventos) / inicial">TSR ~12m %</th>
              <th>Preço/cota %</th>
              <th>Provento %</th>
              <th>Último</th>
              <th>Volume</th>
              <th>CAGR %</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r) => `<tr>
              <td>${r.ticker}</td>
              <td>${fmt(r.dividend_yield_pct)}</td>
              <td><strong>${fmt(r.total_return_12m_pct)}</strong></td>
              <td>${fmt(r.price_return_12m_pct ?? r.trailing_12m_pct)}</td>
              <td>${fmt(r.dividend_contribution_12m_pct)}</td>
              <td>${fmt(r.last, 2)}</td>
              <td>${fmtVol(r.volume)}</td>
              <td>${fmt(r.cagr_since_start_pct)}</td>
            </tr>`).join("")}
          </tbody>
        </table>
        </div>`;
    }

    (async () => {
      const panel = document.getElementById("panel");
      try {
        const data = await loadJSON("/data/dividends_radar.json");
        const top = data.top_yield || [];
        const fiis = data.top_fii || [];
        const upcoming = data.upcoming_payments || [];
        const method = data.method || {};
        if (!top.length && !fiis.length && !upcoming.length) {
          panel.innerHTML = `
            <strong>Aguardando collector</strong>
            <p class="muted">${data.source_note || ""}</p>`;
          return;
        }

        panel.innerHTML = `
          <h2>${method.title || "Dividendos e total return"}</h2>
          <p class="muted">${method.summary || ""}</p>
          <p class="tiny muted"><strong>Fórmula:</strong> ${method.formula || ""}</p>
          <ul class="check muted">
            ${(method.includes || []).map((x) => `<li>Inclui: ${x}</li>`).join("")}
            ${(method.excludes || []).map((x) => `<li>Ainda fora: ${x}</li>`).join("")}
          </ul>
          <p class="tiny muted">${method.liquidity_note || ""}</p>
          <p class="tiny muted" style="margin-top:1rem">${data.source_note || ""} · ${data.as_of || ""}</p>
          ${tableFor(fiis, "Fundos imobiliários (cesta líquida)")}
          ${tableFor(top, "Ações (elite B3)")}
          <p class="tiny muted" style="margin-top:0.75rem">
            Cesta FII é proxy educacional — não é o índice IFIX oficial.
            ${data.analysis_start ? `Janela desde ${data.analysis_start}.` : ""}
          </p>
          ${upcoming.length ? `<h2>Próximos pagamentos</h2><pre class="tiny">${JSON.stringify(upcoming, null, 2)}</pre>` : ""}`;
      } catch (err) {
        panel.textContent = err.message || String(err);
      }
    })();
  </script>
</body>
</html>
