<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de dividendos — Divmetric</title>
  <meta name="description" content="Radar de yields e agenda — alimentado por cópia consolidada diária.">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <div id="site-nav" class="site-nav"></div>
  <header class="page-header">
    <p class="section-kicker">Dividendos · consolidado</p>
    <h1>Radar de <span>dividendos</span></h1>
    <p class="tagline">Yields trailing ~12m a partir dos eventos de dividendos (Yahoo) nos papéis líquidos da elite B3 — janela alinhada desde 2015.</p>
  </header>

  <main class="wrap">
    <section class="card" id="panel">
      <p class="muted">Carregando…</p>
    </section>
  </main>

  <footer class="site-footer">
    · <a href="/">Início</a> · <a href="/calculadora/">Calculadora</a> · <a href="https://velumetric.pages.dev/">Velumetric</a>
  </footer>
  <script src="/assets/site.js"></script>
  <script>
    const { loadJSON } = window.DivmetricSite;
    (async () => {
      const panel = document.getElementById("panel");
      try {
        const data = await loadJSON("/data/dividends_radar.json");
        const top = data.top_yield || [];
        const upcoming = data.upcoming_payments || [];
        if (!top.length && !upcoming.length) {
          panel.innerHTML = `
            <strong>Scaffold pronto</strong>
            <p class="muted">${data.source_note || "Aguardando collector."}</p>
            <p class="tiny muted">Status: ${data.status || "—"} · as_of ${data.as_of || "—"}</p>`;
          return;
        }
        panel.innerHTML = `
          <p class="tiny muted">${data.source_note || ""} · ${data.as_of || ""}</p>
          <h2>Top yield (parcial)</h2>
          <table>
            <thead><tr><th>Ticker</th><th>DY %</th><th>Último</th><th>12m %</th><th>CAGR %</th><th>Ref</th></tr></thead>
            <tbody>
              ${top.map((r) => `<tr><td>${r.ticker}</td><td>${r.dividend_yield_pct}</td><td>${r.last ?? "—"}</td><td>${r.trailing_12m_pct ?? "—"}</td><td>${r.cagr_since_start_pct ?? "—"}</td><td>${r.as_of || ""}</td></tr>`).join("")}
            </tbody>
          </table>
          ${upcoming.length ? `<h2>Próximos pagamentos</h2><pre class="tiny">${JSON.stringify(upcoming, null, 2)}</pre>` : ""}`;
      } catch (err) {
        panel.textContent = err.message || String(err);
      }
    })();
  </script>
</body>
</html>
